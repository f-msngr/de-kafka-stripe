name: ${PROJECT_NAME}
services:
  db-src:
    image: postgres:18.4-bookworm
    container_name: ${PROJECT_NAME}-${SRVC_DBSRC}
    ports: ["127.0.0.1:${HOST_DB_SRC_PORT}:${CTNR_DB_SRC_PORT}"]
    environment:
      POSTGRES_USER: ${DB_SRC_USER}           # NOM ATTENDU PAR L'IMAGE POSTGRES 
      POSTGRES_PASSWORD: ${DB_SRC_PASSWORD}   # NOM ATTENDU PAR L'IMAGE POSTGRES
      POSTGRES_DB: ${DB_SRC_NAME}               # NOM ATTENDU PAR L'IMAGE POSTGRES
      DB_SRC_SCHEMA_1: ${DB_SRC_SCHEMA_1}
      DB_SRC_SCHEMA_2: ${DB_SRC_SCHEMA_2}
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      DEBEZIUM_PUBLICATION: ${DEBEZIUM_PUBLICATION}
    volumes:
      - ./${SRVC_DBSRC}:/docker-entrypoint-initdb.d
      - ${SRVC_DBSRC}-data:/var/lib/postgresql       # volume nommé db-src-data pour faire persister les données de la base source
    # command
    # Prévoir la modification du port par défaut
    # max_replication_slots : Nombre de slots de réplication logiques (pour Debezium)
    command: >
      postgres
      -c port=${CTNR_DB_SRC_PORT}
      -c wal_level=logical
      -c max_slot_wal_keep_size=10GB
      -c max_replication_slots=5
    networks:
      - stripe-network
    healthcheck:
      # CMD-SHELL cf. kafka.healthcheck
      # Prévoir la modification du port par défaut
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p ${CTNR_DB_SRC_PORT} -U $$POSTGRES_USER"]   # POSTGRES_USER est dans les env du conteneur -> $$POSTGRES_USER est connu
      interval: 10s       # On espace les vérifications pour ne pas surcharger le processeur
      timeout: 5s         # On laisse 5s à Postgres pour répondre (Utile si le disque est saturé par les inserts)
      retries: 30         # On augmente à 30 essais
      start_period: 5m    # 5 minutes d'immunité totale pour laisser l'import se faire tranquillement

  db-target:
    image: clickhouse/clickhouse-server:${CLICKHOUSE_VERSION}
    container_name: ${PROJECT_NAME}-${SRVC_DBTARGET}
    ports: ["127.0.0.1:${HOST_DB_TARGET_PORT}:${CTNR_DB_TARGET_PORT}"]
    environment:
      CLICKHOUSE_HOST: ${SRVC_DBTARGET}               # Nom libre
      CLICKHOUSE_PORT: ${CTNR_DB_TARGET_PORT}         # Nom libre
      CLICKHOUSE_USER: ${DB_TARGET_USER}              # Nom imposé par Clickhouse
      CLICKHOUSE_PASSWORD: ${DB_TARGET_PASSWORD}      # Nom imposé par Clickhouse
      CLICKHOUSE_DB: ${DB_TARGET_NAME}                # Nom imposé par Clickhouse
    volumes:
      # - ./${SRVC_DBTARGET}/config.d/${SERVER_CONF}.xml:/etc/clickhouse-server/config.d/${SERVER_CONF}.xml:ro  # Non utilisé pour le moment
      # - ./${SRVC_DBTARGET}/users.d/${USERS_CONF}.xml:/etc/clickhouse-server/users.d/${USERS_CONF}.xml:ro      # Non utilisé pour le moment
      - ./${SRVC_DBTARGET}/initdb/10_raw_tables.sh:/docker-entrypoint-initdb.d/10_raw_tables.sh:ro          # initialisation de la base avec les scripts montés dans le conteneur
      - ./${SRVC_DBTARGET}/sql/10_raw_tables_from_dbsrc.sql:/sql/10_raw_tables_from_dbsrc.sql:ro            # Le SQL lu par le script
      - ${SRVC_DBTARGET}-data:/var/lib/clickhouse    # volume nommé dans la rubrique volumes - persiste sauf si effacé avec docker compose down -v
    # command: >
      # postgres -c port=${CTNR_DB_TARGET_PORT}
    networks:
      - stripe-network
      - stripe-dbt-network          # api-dbt peut joindre db-target
    healthcheck:
      # CMD-SHELL cf. kafka-broker.healthcheck
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:${CTNR_DB_TARGET_PORT}/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ulimits:                                          # option importante
      nofile: { soft: 262144, hard: 262144 }

  kafka-broker:
    image: quay.io/debezium/kafka:${DEBEZIUM_VERSION}
    container_name: ${PROJECT_NAME}-kafka-broker
    ports: ["127.0.0.1:${HOST_KAFKA_PORT}:${CTNR_KAFKA_EXTERNAL_LISTENER_PORT}"]     # défaut : "9092:9092" = port du listener externe au sein du conteneur
    environment:
      CLUSTER_ID: ${CLUSTER_ID}
      NODE_ID: ${NODE_ID}
      NODE_ROLE: ${NODE_ROLE}
      KAFKA_CONTROLLER_QUORUM_VOTERS: ${KAFKA_CONTROLLER_QUORUM_VOTERS}
      KAFKA_LISTENERS: ${KAFKA_LISTENERS}
      KAFKA_ADVERTISED_LISTENERS: ${KAFKA_ADVERTISED_LISTENERS}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: ${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'     # Création automatique des topics (côté broker)
      # Rétention par défaut pour tous les topics
      KAFKA_LOG_RETENTION_MS: 86400000        # 24h
      KAFKA_LOG_RETENTION_BYTES: 1073741824   # 1GB par partition
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000  # vérif toutes les 5min
      KAFKA_LOG_SEGMENT_BYTES: 536870912      # segments de 512MB
    networks:
      - stripe-network
    healthcheck:
      # On a besoin de connaître le path des scripts de l'image Debezium pour le healthcheck
      # On localise les scripts avec docker run --rm --entrypoint sh quay.io/debezium/kafka:3.6 -c 'find / -name "kafka-broker-api-versions*" 2>/dev/null'
      # le path est passé à CMD-SHELL pour le healthcheck
      # On utilise CMD-SHELL pour envoyer des commandes avec des redirections et l'expansion de variables
      test: ["CMD-SHELL", "/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server ${BOOTSTRAP_SERVERS} > /dev/null"]   # BOOTSTRAP_SERVERS n'est pas dans les env du conteneur, donc on l'appelle depuis .env
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-connect:
    build:
      context: ./${SRVC_CONNECT}
      args:
        DEBEZIUM_VERSION: ${DEBEZIUM_VERSION}                 # passé au build des images des étapes 1 et 2
      dockerfile: Dockerfile
    pull_policy: build                                    # reconstruit l'image à chaque `up` pour charger les nouveaux plugins (sinon l'image existante est réutilisée)
    container_name: ${PROJECT_NAME}-${SRVC_CONNECT}
    ports: ["127.0.0.1:${HOST_CONNECT_PORT}:${CTNR_CONNECT_PORT}"]           # défaut : "8083:8083"
    environment:
      REST_PORT: ${CTNR_CONNECT_PORT}                         # Nom attendu par l'image Debezium Connect si différent de 8083
      GROUP_ID: ${GROUP_ID_CONNECT}
      CONFIG_STORAGE_TOPIC: ${CONFIG_STORAGE_TOPIC}           # Topic propre à Kafka pour stocker les infos sur configs
      OFFSET_STORAGE_TOPIC: ${OFFSET_STORAGE_TOPIC}           # Topic propre à Kafka pour stocker les infos sur offsets
      STATUS_STORAGE_TOPIC: ${STATUS_STORAGE_TOPIC}           # Topic propre à Kafka pour stocker les infos sur status
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      CONNECT_TOPIC_CREATION_ENABLE: 'true'                   # Création automatique des topics (côté connect)
      CONNECT_CONFIG_PROVIDERS: 'env'                         # Déclarer le provider "env"
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: 'org.apache.kafka.common.config.provider.EnvVarConfigProvider'  # Spécifier la classe Java associée au provider
      SRVC_DBSRC: ${SRVC_DBSRC}                               # -> connector.json : db hostname
      CTNR_DB_SRC_PORT: ${CTNR_DB_SRC_PORT}                   # -> connector.json : db port
      DEBEZIUM_USER: ${DEBEZIUM_USER}
      DEBEZIUM_PASSWORD: ${DEBEZIUM_PASSWORD}
      DB_SRC_NAME: ${DB_SRC_NAME}
      TOPIC_PREFIX: ${TOPIC_PREFIX_CONNECT}
      SRC_TABLES: ${SRC_TABLES_CONNECT}
      DEBEZIUM_SLOT: ${DEBEZIUM_SLOT}
      DEBEZIUM_PUBLICATION: ${DEBEZIUM_PUBLICATION}
      # ENV pour la db-target
      DB_TARGET_HOST: ${SRVC_DBTARGET}
      DB_TARGET_PORT: ${CTNR_DB_TARGET_PORT}
      DB_TARGET_USER: ${DB_TARGET_USER}
      DB_TARGET_PASSWORD: ${DB_TARGET_PASSWORD}
      DB_TARGET_NAME: ${DB_TARGET_NAME}
    networks:
      - stripe-network
    depends_on:
      kafka-broker:
        condition: service_healthy
      db-target:
        condition: service_healthy                        # La DB cible doit être prête avant le sink
    healthcheck:
      # CMD-SHELL cf. kafka-broker.healthcheck
      test: ["CMD-SHELL", "/kafka/check-connectors.sh"]   # On vérifie que le service est bien démarré et qu'il répond aux requêtes HTTP
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka-init-connectors:           # Initialise les connecteurs
    image: curlimages/curl:latest
    container_name: ${PROJECT_NAME}-${SRVC_CONNECT}-init
    environment:
      SRVC_CONNECT: ${SRVC_CONNECT}
      CTNR_CONNECT_PORT: ${CTNR_CONNECT_PORT}
      PROJECT_NAME: ${PROJECT_NAME}
    networks:
      - stripe-network
    depends_on:
      kafka-connect:
        condition: service_healthy
      db-src:
        condition: service_healthy
    volumes:
      - ./${SRVC_CONNECT}/configs:/configs
      - ./${SRVC_CONNECT}/scripts/init.sh:/init.sh
    entrypoint: sh /init.sh

  kafka-init-topics:                # Initialise les topics (autres que ceux pour le DCD debezium)
    image: quay.io/debezium/kafka:${DEBEZIUM_VERSION}
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      TOPIC_INCOMING_TNX: ${TOPIC_INCOMING_TNX}
      PARTITIONS_TOPIC_INCOMING_TNX: ${PARTITIONS_TOPIC_INCOMING_TNX}
    networks:
      - stripe-network
    entrypoint: ["/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "${BOOTSTRAP_SERVERS}", "--create", "--if-not-exists", "--topic", "${TOPIC_INCOMING_TNX}", "--partitions", "${PARTITIONS_TOPIC_INCOMING_TNX}", "--replication-factor", "1"]
    depends_on:
      kafka-broker:
        condition: service_healthy

  api-dbt:
    build:
      context: ./${SRVC_APIDBT}
      dockerfile: ./Dockerfile
      #pull_policy: build
    image: ${PROJECT_NAME}-${SRVC_APIDBT}-image
    container_name: ${PROJECT_NAME}-${SRVC_APIDBT}
    restart: unless-stopped
    environment:
      #HOST_APIDBT_PORT: ${HOST_APIDBT_PORT}
      DBT_SEND_ANONYMOUS_USAGE_STATS: false           # Pas d'envoi de stats d'usage anonyme à snowplow
      CTNR_APIDBT_PORT: ${CTNR_APIDBT_PORT}
      CLICKHOUSE_HOST: ${SRVC_DBTARGET}               # Nom libre - même nom que pour dbt-target
      CLICKHOUSE_PORT: ${CTNR_DB_TARGET_PORT}         # Nom libre - même nom que pour dbt-target
      CLICKHOUSE_USER: ${DB_TARGET_USER}              # même nom que pour dbt-targetNom imposé par Clickhouse
      CLICKHOUSE_PASSWORD: ${DB_TARGET_PASSWORD}      # même nom que pour dbt-target
      CLICKHOUSE_DB: ${DB_TARGET_NAME}
      DBT_RUN_STATUS_FILE: ${DBT_RUN_STATUS_FILE}     # fichier status copié dans un volume
      DBT_PROJECT_DIR: ${DBT_APP_PATH}/${DBT_OLAP_PROJECT}            # DBT_PROJECT_DIR : Nom spécifique à dbt
      DBT_OLAP_PROJECT: ${DBT_OLAP_PROJECT}
      # Seuils pour les transactions
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD}                     # Seuil de rejet d'une transaction inline
      CLEARED_PENDING_BOUNDARY: ${CLEARED_PENDING_BOUNDARY}   # Seuil de litige pour une transaction valide
    volumes:
      - ./${SRVC_APIDBT}/project/${DBT_OLAP_PROJECT}:${DBT_APP_PATH}/${DBT_OLAP_PROJECT}/          # project = nom du rep local choisi pour le dossier monté dans le conteneur pour copie des fichiers dans <DBT_DB_IN_WAREHOUSE> pour un setup équivalent à dbt init <DBT_PROJECT>
      - ./${SRVC_APIDBT}/project/logs:${DBT_APP_PATH}/logs
      - ./${SRVC_APIDBT}/src/:${DBT_APP_PATH}/src             # monter le rep src/ dans app/
      - ${SRVC_APIDBT}-data:${DBT_APP_PATH}/run_status        # monter le rep de status.json/ dans un volume nommé pour la persistance
    networks:
      - stripe-dbt-network      # réseau spécifque pour contrôler qui peut interagir avec lui
    healthcheck:
      # healthcheck s'execute par curl dans le conteneur donc pas besoin d'exposer un port
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${CTNR_APIDBT_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      db-target:
        condition: service_healthy


  api-gateway:
    build:
      context: .
      dockerfile: ./${SRVC_APIGATEWAY}/Dockerfile
    image: ${PROJECT_NAME}-${SRVC_APIGATEWAY}-image
    container_name: ${PROJECT_NAME}-${SRVC_APIGATEWAY}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HOST_APIGATEWAY_PORT}:${CTNR_APIGATEWAY_PORT}"
    environment:
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      CTNR_APIGATEWAY_PORT: ${CTNR_APIGATEWAY_PORT}
      TOPIC_INCOMING_TNX: ${TOPIC_INCOMING_TNX}                 # Topic for incoming transactions
      URL_APIDBT: ${URL_APIDBT}
      # Connexion à Clickhouse
      CLICKHOUSE_HOST: ${SRVC_DBTARGET}               # Nom libre - même nom que pour dbt-target
      CLICKHOUSE_PORT: ${CTNR_DB_TARGET_PORT}         # Nom libre - même nom que pour dbt-target
      CLICKHOUSE_USER: ${DB_TARGET_USER}              # même nom que pour dbt-targetNom imposé par Clickhouse
      CLICKHOUSE_PASSWORD: ${DB_TARGET_PASSWORD}      # même nom que pour dbt-target
      CLICKHOUSE_DB: ${DB_TARGET_NAME}
      # Répertoires + DB des marts construits par DBT
      DBT_MARTS: ${DBT_MARTS}
    networks:
      - stripe-network
      - stripe-dbt-network          # peut contrôler dbt sur les endpoints de son API
    volumes:
      - ./api-gateway/src:/home/user/app/src              # allows API hot reload
      # - ./pipeline:/home/user/app/pipeline              # access pipeline/ functions
    healthcheck:
      # healthcheck s'execute par curl dans le conteneur donc pas besoin d'exposer un port
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:${CTNR_APIGATEWAY_PORT}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    depends_on:
      db-target:                          # api-gateway créée une connexion à clickhouse au démarrage
        condition: service_healthy
      kafka-broker:
        condition: service_healthy
      kafka-init-topics:
        condition: service_completed_successfully
      api-dbt:
        condition: service_healthy
      

  producer-tnx:
    build:
      context: ./${SRVC_PRODUCERTNX}
      dockerfile: ./Dockerfile
    image: ${PROJECT_NAME}-${SRVC_PRODUCERTNX}-image
    container_name: ${PROJECT_NAME}-${SRVC_PRODUCERTNX}
    environment:
      URL_API: "http://${SRVC_APIGATEWAY}:${CTNR_APIGATEWAY_PORT}"        # Valid in dev mode - needs to be set with API GATEWAY external IP address in prod
      URL_FEED: ${URL_FEED_PRODUCERTNX}                                   # URL du csv de transactions depuis S3 - lu en batch par le worker
    networks:
      - stripe-network
    volumes:
      - ./producer-tnx:/home/user/app                     # allows API hot reload
      # - ./pipeline:/home/user/app/pipeline              # access pipeline/ functions
    depends_on:
      kafka-broker:
        condition: service_healthy
      api-gateway:
        condition: service_healthy

  consumer-tnx:           # worker(s) predict
    build:
      context: ./${SRVC_CONSUMERTNX}
      dockerfile: ./Dockerfile
    image: ${PROJECT_NAME}-${SRVC_CONSUMERTNX}-image
    # container_name: ${PROJECT_NAME}-${SRVC_CONSUMERTNX}     # On supprime container-name pour permettre le scaling par docker compose : --scale <NOM_DU_SERVICE>=3
    deploy:
      replicas: ${REPLICAS_CONSUMERTNX}
    environment:
      SRVC_CONSUMERTNX: ${SRVC_CONSUMERTNX}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}             # Le consumer a besoin d"accéder au topic kafka directement
      TOPIC_INCOMING_TNX: ${TOPIC_INCOMING_TNX}
      GROUP_ID: ${GROUP_ID_CONSUMERTNX}
      FRAUD_THRESHOLD: ${FRAUD_THRESHOLD}                     # Seuil de rejet d'une transaction inline
      CLEARED_PENDING_BOUNDARY: ${CLEARED_PENDING_BOUNDARY}   # Seuil de litige pour une transaction valide
      # Connexion à db-src
      DB_SRC_HOST: ${SRVC_DBSRC}
      DB_SRC_PORT: ${CTNR_DB_SRC_PORT}
      DB_SRC_USER: ${DB_SRC_USER}
      DB_SRC_PASSWORD: ${DB_SRC_PASSWORD}
      DB_SRC_NAME: ${DB_SRC_NAME}
      DB_SRC_SCHEMA_1: ${DB_SRC_SCHEMA_1}               # payments
      DB_SRC_SCHEMA_2: ${DB_SRC_SCHEMA_2}               # frauds
    networks:
      - stripe-network
    depends_on:
      kafka-broker:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      db-src:
        condition: service_healthy    # écriture dans db-src

volumes:
  db-src-data:              # Volume nommé - effacé avec docker compose down -v
  db-target-data:           # Volume nommé - effacé avec docker compose down -v
  api-dbt-data:

networks:
  stripe-network:
    name: ${PROJECT_NAME}
  stripe-dbt-network:
    name: ${PROJECT_NAME}-dbt