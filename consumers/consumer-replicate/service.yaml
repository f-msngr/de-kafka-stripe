  consumer-replicate:                 # Consumer nommé replicate pour permettre une archi à plusieurs consumers
    build:
      context: ./consumers/consumer-replicate
      dockerfile: Dockerfile
    container_name: ${PROJECT_NAME}-consumer-replicate    # Un conteneur par topic
    environment:
      PYTHONUNBUFFERED: 1
      SINK_HOST: ${SRVC_DBTARGET}                   # Nom du service qui héberge la base target
      SINK_PORT: ${CTNR_DB_TARGET_PORT}             # Port d'écoute de la base dans le conteneur du service
      SINK_DB: ${DB_TARGET_NAME}                    # Nom de la base cible dans le conteneur du service
      SINK_USER: ${DB_TARGET_USER}
      SINK_PASSWORD: ${DB_TARGET_PASSWORD}
      BOOTSTRAP_SERVERS: ${BOOTSTRAP_SERVERS}
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID_MONITOR}     # Valeur passée à Kafka (au prog python du consumer) pour que Kafka connaisse les offsets du consumer dans chaque topic. Le nom du groupe est partagé par tous les consumers qui consomment les mêmes topics pour que Kafka répartisse les partitions entre eux. 
      TOPIC_PREFIX: ${TOPIC_PREFIX_CONNECT}    
      SRC_TABLES: ${SRC_TABLES_CONNECT}
    networks:
      - project-network
    depends_on:
      kafka-broker:
        condition: service_healthy
      db-target:
        condition: service_healthy
      init:
        condition: service_completed_successfully
