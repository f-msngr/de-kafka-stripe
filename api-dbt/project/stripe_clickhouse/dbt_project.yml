
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'stripe_clickhouse'   # fab - nom du projet <DBT_DB_IN_WAREHOUSE>
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'stripe_clickhouse'  # fab - nom du profil utilisé pour ce projet

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# Les modèles sont enregistrés selon la clé +schema dans une base spécifique
# Le nom de cette base est contruit en suffixant par la clé +schema le nom de la base <schema> défini dans profiles.yml
# Permet d'isoler les modèles de prod des autres modèles
models:
  stripe_clickhouse:
    staging:
      +materialized: view
      +schema: staging        # crée stripe_staging
    intermediate:
      +materialized: view
      +schema: intermediate   # crée stripe_intermediate
    marts:
      +materialized: view   # passer à 'table' si le calcul devient trop lent
      +schema: marts   # crée stripe_marts
      olap:
        +materialized: table    # le sous rep olap/ créé spécifiquement des tables